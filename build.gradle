plugins {
    id 'java'
    id 'application'
    // id 'org.openjfx.javafxplugin' version '0.1.0'  // Simplifies JavaFX dependency setup
}

jar {
    manifest {
        // attributes 'Main-Class': 'main.java.Test.EntryPoint'
        attributes 'Main-Class': 'Test.App'
    }
}

application {
    mainClass = 'Test.App'
}

// ---

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

/**
 * Can't get the run command to work with wsl. To run, execute "./gradlew run" in a powershell/cmd terminal
 */
run {
    jvmArgs = [
        // "--module-path", "/mnt/c/Users/gaggg/Desktop/Projects/javafx-sdk-24.0.1/lib",
        "--module-path", "C:/Users/gaggg/Desktop/Projects/javafx-sdk-24.0.1/lib",
        "--add-modules", "javafx.controls,javafx.fxml",
    ]
}

